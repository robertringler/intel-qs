[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payeeproof"
version = "1.0.0"
description = "Payee assurance and Nacha fraud-monitoring evidence for mid-market ACH/wire originators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<2.2",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  "argon2-cffi>=23.1",
  "pyotp>=2.9,<3",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "stripe>=10",
  "pydantic-settings>=2.4,<3",
  "redis>=5",
  "prometheus-client>=0.20",
  "sentry-sdk>=2.10",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "httpx>=0.27",
  "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "coverage>=7.6",
]

[project.scripts]
payeeproof = "payeeproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
payeeproof = ["templates/*.html", "templates/**/*.html", "static/*", "migrations/*.ini", "migrations/*.py", "migrations/versions/*.py", "data/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PLE", "PLW"]
ignore = ["S101", "B008", "RUF012", "PLW0603", "S608", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "S603", "S607", "S108", "PLW1510", "S110"]
"src/payeeproof/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["payeeproof"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = "payeeproof.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
  "e2e: browser end-to-end tests (require Chromium)",
  "perf: performance tests",
]

[tool.coverage.run]
source = ["payeeproof"]
branch = true
omit = ["*/migrations/*"]

[tool.bandit]
exclude_dirs = ["tests"]
