{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card narrow">
<h1>Sign in</h1>
<form class="stack" method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username" value="{{ email or '' }}">
  <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
<p class="small"><a href="/forgot">Forgot password?</a> · <a href="/signup">Create an account</a></p>
</div>
{% endblock %}
