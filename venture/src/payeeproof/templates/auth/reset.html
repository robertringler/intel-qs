{% extends "base.html" %}{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="card narrow"><h1>Choose a new password</h1>
<form class="stack" method="post" action="/reset/{{ token }}">
  <label for="password">New password (12+ characters)</label><input id="password" name="password" type="password" minlength="12" required autocomplete="new-password">
  <button type="submit">Set password</button>
</form><p class="small muted">All existing sessions will be signed out.</p></div>
{% endblock %}
